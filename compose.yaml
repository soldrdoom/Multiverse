x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  nats:
    image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: nats
    restart: unless-stopped
    command: ['-js', '-sd', '/data/jetstream', '-m', '8222']
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  valkey:
    image: valkey/valkey@sha256:abfa1257a96f0de6a8bb0dbc5425c34c09724ef078c3a4371cde344e748dbe71
    container_name: valkey
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  fluxer_server:
    image: multiverse-server:local
    container_name: fluxer_server
    restart: unless-stopped
    init: true
    user: "1001:1001"
    environment:
      HOME: /tmp
      FLUXER_CONFIG: /usr/src/app/config/config.json
      NODE_ENV: production
      SOLANA_DAS_URL: https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}
      SOLANA_TREASURY_WALLET: 4iLSmzRJzm682ojiqM6xhNaWTAx6EpCcgypYh8srzrii
      COREPACK_HOME: /tmp/corepack
    ports:
      - '127.0.0.1:${FLUXER_HTTP_PORT:-8080}:8080'
    depends_on:
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./config:/usr/src/app/config:ro
      - ./server_data:/usr/src/app/fluxer_server/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/_health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  fluxer_gateway:
    image: fluxer-gateway:local
    container_name: fluxer_gateway
    restart: unless-stopped
    network_mode: "service:fluxer_server"
    environment:
      FLUXER_CONFIG: /usr/src/app/config/config.json
    volumes:
      - ./config:/usr/src/app/config:ro
    depends_on:
      nats:
        condition: service_healthy
      fluxer_server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8082/_health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  iris_bot:
    image: iris-bot:local
    container_name: iris_bot
    restart: unless-stopped
    user: "1001:1001"
    environment:
      IRIS_BOT_TOKEN: ${IRIS_BOT_TOKEN:?Set IRIS_BOT_TOKEN in .env or environment}
      IRIS_OWNER_USER_ID: ${IRIS_OWNER_USER_ID:?Set IRIS_OWNER_USER_ID in .env or environment}
      IRIS_INSTANCE_BASE_URL: ${IRIS_INSTANCE_BASE_URL:-https://multiverse.forum}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env or environment}
    depends_on:
      fluxer_server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/_health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: meilisearch
    profiles: ['search']
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env or environment}
      MEILI_DB_PATH: /meili_data
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    ports:
      - '${MEILI_PORT:-7700}:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:7700/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  elasticsearch:
    image: elasticsearch:8.19.11
    container_name: elasticsearch
    profiles: ['search']
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:v1.9.11
    container_name: livekit
    profiles: ['voice']
    restart: unless-stopped
    command: ['--config', '/etc/livekit/livekit.yaml']
    volumes:
      - ./config/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - '${LIVEKIT_PORT:-7880}:7880'
      - '7881:7881'
      - '3478:3478/udp'
      - '50000-50100:50000-50100/udp'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7880 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  nats_data:
  valkey_data:
  fluxer_data:
  meilisearch_data:
  elasticsearch_data:
