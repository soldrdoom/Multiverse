account_disabled_suspicious:
  subject: Multiverse hesabın geçici olarak devre dışı bırakıldı
  body: |-
    Merhaba {username},

    Şüpheli etkinlik tespit ettiğimiz için Multiverse hesabını geçici olarak devre dışı bıraktık.

    {reason, select,
      null {}
      other {Neden: {reason}}
    }

    Hesabına yeniden erişmek için şifreni sıfırlaman gerekiyor:

    {forgotUrl}

    Şifreni sıfırladıktan sonra tekrar giriş yapabilirsin.

    Bunun bir hata olduğunu düşünüyorsan destek ekibimizle iletişime geç.

    – Multiverse Güvenlik Ekibi
account_scheduled_deletion:
  subject: Multiverse hesabın kalıcı olarak silinecek
  body: |-
    Merhaba {username},

    Multiverse hesabın, hizmet şartlarımızı veya topluluk kurallarımızı ihlal ettiğin için kalıcı olarak silinmek üzere planlandı.

    Planlanan silinme tarihi: {deletionDate, date, full} {deletionDate, time, short}

    {reason, select,
      null {}
      other {Neden: {reason}}
    }

    Bu ciddi bir yaptırımdır. Hesap verilerin, planlanan tarihte kalıcı olarak silinecek.

    Lütfen şunları gözden geçir:
    - Hizmet şartları: {termsUrl}
    - Topluluk kuralları: {guidelinesUrl}

    İtiraz süreci:
    Bu yaptırım kararının hatalı veya haksız olduğunu düşünüyorsan, bu e-posta adresinden appeals@fluxer.app adresine 60 gün içinde itiraz edebilirsin.

    İtirazında lütfen:
    - Kararın neden hatalı veya haksız olduğunu net bir şekilde açıkla
    - Varsa ilgili kanıtları veya ek bağlamı paylaş

    Multiverse Güvenlik Ekibinden bir üye itirazını inceleyecek ve nihai karar verilene kadar planlanan silme işlemini durdurabilir.

    – Multiverse Güvenlik Ekibi
account_temp_banned:
  subject: Multiverse hesabın geçici olarak askıya alındı
  body: |-
    Merhaba {username},

    Multiverse hesabın, hizmet şartlarımızı veya topluluk kurallarımızı ihlal ettiğin için geçici olarak askıya alındı.

    Süre: {durationHours, plural,
      =1 {1 saat}
      other {# saat}
    }
    Askıya alınma bitişi: {bannedUntil, date, full} {bannedUntil, time, short}

    {reason, select,
      null {}
      other {Neden: {reason}}
    }

    Bu süre boyunca hesabına erişemezsin.

    Lütfen şunları gözden geçir:
    - Hizmet şartları: {termsUrl}
    - Topluluk kuralları: {guidelinesUrl}

    Bu yaptırım kararının hatalı veya haksız olduğunu düşünüyorsan, bu e-posta adresinden appeals@fluxer.app adresine itiraz edebilirsin. Lütfen kararın neden hatalı olduğunu açıkça yaz. İtirazını inceleyip kararımızı sana bildireceğiz.

    – Multiverse Güvenlik Ekibi
donation_confirmation:
  subject: Multiverse bağışınız için teşekkürler
  body: |-
    Merhaba,

    Multiverse'a bağışınız için teşekkürler! {interval, select,
      month {Düzenli bağışınız}
      year {Düzenli bağışınız}
      other {Tek seferlik bağışınız}
    } başarıyla {interval, select,
      month {kuruldu}
      year {kuruldu}
      other {işleme alındı}
    }.

    Bağış detayları:
    Tutar: {amount} {currency} {interval, select,
      month {aylık}
      year {yıllık}
      other {}
    }

    Stripe kısa süre içinde fatura PDF'inizi içeren ayrı bir makbuz gönderecek. Bu, tüm ödeme detaylarını içerir ve vergi amaçlarıyla kullanılabilir.

    Bağış geçmişinizi görüntüleyebilir, faturaları indirebilir, {interval, select,
      month {ve aboneliğinizi yönetebilir veya iptal edebilirsiniz}
      year {ve aboneliğinizi yönetebilir veya iptal edebilirsiniz}
      other {ve gelecekteki bağışları yönetebilirsiniz}
    } bu bağlantıyı kullanarak istediğiniz zaman:

    {manageUrl}

    Desteğiniz Multiverse'in çalışmasını sağlıyor. Teşekkürler!

    – Multiverse Ekibi
donation_magic_link:
  subject: Multiverse bağışlarını yönet
  body: |-
    Merhaba,

    Bağışçı portalına erişmek için aşağıdaki bağlantıya tıkla:

    {manageUrl}

    Portalda abonelikleri yönetebilir, faturaları indirebilir ve bağış geçmişini görüntüleyebilirsin.

    Bu bağlantı {expiresAt, date, full} tarihinde {expiresAt, time, short} saatinde geçersiz olur.

    Bunu sen istemediysen bu e-postayı yok sayabilirsin.

    – Multiverse Ekibi
dsa_report_verification:
  subject: DSA bildirimi için e-posta adresini doğrula
  body: |-
    Merhaba,

    Multiverse'da Dijital Hizmetler Yasası (DSA) kapsamında bildirim gönderebilmek için aşağıdaki doğrulama kodunu kullan:

    {code}

    Bu kod {expiresAt, date, full} tarihinde {expiresAt, time, short} saatinde geçersiz olur.

    Bunu sen istemediysen bu e-postayı yok sayabilirsin.

    – Multiverse Güvenlik Ekibi
email_change_new:
  subject: Yeni Multiverse e-posta adresini doğrula
  body: |-
    Merhaba {username},

    Yeni Multiverse e-posta adresini doğrulamak için uygulamada bu kodu gir:

    {code}

    Bu kod {expiresAt, date, full} tarihinde {expiresAt, time, short} saatinde geçersiz olur.

    Bunu sen istemediysen bu e-postayı yok sayabilirsin.

    – Multiverse Ekibi
email_change_original:
  subject: Multiverse e-posta değişikliğini onayla
  body: |-
    Merhaba {username},

    Multiverse hesabındaki e-posta adresini değiştirmek için bir istek aldık.

    Bu değişikliği onaylamak için uygulamada şu kodu gir:

    {code}

    Bu kod {expiresAt, date, full} tarihinde {expiresAt, time, short} saatinde geçersiz olur.

    Bunu sen istemediysen hesabını hemen güvene al.

    – Multiverse Ekibi
email_change_revert:
  subject: Multiverse e-posta adresin değiştirildi
  body: |-
    Merhaba {username},

    Multiverse hesabının e-posta adresi {newEmail} olarak değiştirildi.

    Bu değişikliği sen yaptıysan bir şey yapmana gerek yok. Yapmadıysan, aşağıdaki bağlantıyı kullanarak değişikliği geri alabilir ve hesabını güvene alabilirsin:

    {revertUrl}

    Bu işlem önceki e-posta adresini geri yükler, seni tüm cihazlardan çıkış yaptırır, bağlı telefon numaralarını kaldırır, çok faktörlü kimlik doğrulamayı (MFA) devre dışı bırakır ve yeni bir şifre belirlemeni zorunlu kılar.

    – Multiverse Güvenlik Ekibi
email_verification:
  subject: Multiverse e-posta adresini doğrula
  body: |-
    Merhaba {username},

    Multiverse hesabının e-posta adresini doğrulamak için aşağıdaki bağlantıya tıkla:

    {verifyUrl}

    Multiverse hesabını sen açmadıysan bu e-postayı güvenle yok sayabilirsin.

    Bu bağlantı 24 saat boyunca geçerlidir.

    – Multiverse Ekibi
gift_chargeback_notification:
  subject: Hediye kodundan kazandığın avantajlar kaldırıldı
  body: |-
    Merhaba {username},

    Kullandığın bir hediye kodu aslında başka biri tarafından satın alınmıştı. Bu ödeme daha sonra geri alındı (chargeback).

    Bu nedenle, hediyeyi kullandığında hesabına eklenen avantajları kaldırdık.

    Bunun bir hata olduğunu düşünüyorsan, destek ekibimizle iletişime geç ve hediye kodu ile ne zaman kullandığına dair elindeki tüm detayları paylaş.

    – Multiverse Ekibi
harvest_completed:
  subject: Multiverse veri dışa aktarımın indirilmeye hazır
  body: |-
    Merhaba {username},

    Veri dışa aktarımın hazır.

    İndirme bağlantısı:
    {downloadUrl}

    İçerilen mesaj sayısı: {totalMessages, number}
    Dosya boyutu: {fileSizeMB, number} MB

    Bu bağlantı {expiresAt, date, full} tarihinde {expiresAt, time, short} saatinde geçersiz olur.

    Bu dışa aktarımı sen istemediysen şifreni hemen değiştir ve destek ekibimizle iletişime geç.

    – Multiverse Ekibi
inactivity_warning:
  subject: Hareketsizlik nedeniyle Multiverse hesabın silinecek
  body: |-
    Merhaba {username},

    {lastActiveDate, date, full} tarihinden beri Multiverse hesabında herhangi bir etkinlik görmedik.

    {deletionDate, date, full} tarihinde {deletionDate, time, short} saatine kadar giriş yapmazsan, hesabın hareketsizlik nedeniyle kalıcı olarak silinecek.

    Buradan giriş yap:
    {loginUrl}

    Multiverse'i yakın zamanda kullandıysan, hemen destek ekibimizle iletişime geç.

    – Multiverse Ekibi
ip_authorization:
  subject: Yeni bir IP adresinden girişi onayla
  body: |-
    Merhaba {username},

    Multiverse hesabına yeni bir IP adresinden giriş denemesi tespit ettik:

    IP adresi: {ipAddress}
    Konum: {location}

    Bu senin girişinse, aşağıdaki bağlantıyı kullanarak bu IP adresini onayla:

    {authUrl}

    Giriş yapmayı sen denemediysen şifreni hemen değiştir.

    Bu onay bağlantısı 30 dakika boyunca geçerlidir.

    – Multiverse Ekibi
password_change_verification:
  subject: Multiverse şifre değişikliğini onayla
  body: |-
    Merhaba {username},

    Multiverse hesabındaki şifreyi değiştirmek için bir istek aldık.

    Bu değişikliği onaylamak için uygulamada şu kodu gir:

    {code}

    Bu kod {expiresAt, date, full} tarihinde {expiresAt, time, short} saatinde geçersiz olur.

    Bunu sen istemediysen, birisi hesabına erişmiş olabilir. Hemen şifreni değiştir ve iki faktörlü kimlik doğrulamayı etkinleştir.

    – Multiverse Ekibi
password_reset:
  subject: Multiverse şifreni sıfırla
  body: |-
    Merhaba {username},

    Multiverse şifreni sıfırlamak için bir istekte bulundun. Yeni bir şifre belirlemek için aşağıdaki bağlantıyı kullan:

    {resetUrl}

    Bu şifre sıfırlamayı sen istemediysen bu e-postayı güvenle yok sayabilirsin.

    Bu bağlantı 1 saat boyunca geçerlidir.

    – Multiverse Ekibi
registration_approved:
  subject: Multiverse kaydın onaylandı
  body: |-
    Merhaba {username},

    Güzel haber: Multiverse kaydın onaylandı.

    Artık Multiverse uygulamasına şu adresten giriş yapabilirsin:
    {channelsUrl}

    Multiverse topluluğuna hoş geldin.

    – Multiverse Ekibi
report_resolved:
  subject: Multiverse bildirimin değerlendirildi
  body: |-
    Merhaba {username},

    Bildirimin (ID: {reportId}) Multiverse Güvenlik Ekibi tarafından değerlendirildi.

    Güvenlik ekibinin yanıtı:
    {publicComment}

    Multiverse'i herkes için güvenli tutmamıza yardımcı olduğun için teşekkürler. Tüm bildirimleri ciddiye alıyoruz ve topluluğa yaptığın katkıyı takdir ediyoruz.

    Bu sonuç hakkında soruların ya da endişelerin varsa safety@fluxer.app adresinden bize ulaş.

    – Multiverse Güvenlik Ekibi
scheduled_deletion_notification:
  subject: Multiverse hesabın kalıcı olarak silinecek
  body: |-
    Merhaba {username},

    Multiverse hesabın kalıcı olarak silinmek üzere planlandı.

    Planlanan silinme tarihi: {deletionDate, date, full} {deletionDate, time, short}

    {reason, select,
      null {}
      other {Neden: {reason}}
    }

    Bu ciddi bir yaptırımdır. Hesap verilerin, planlanan tarihte kalıcı olarak silinecek.

    Bu yaptırım kararının hatalı olduğunu düşünüyorsan, bu e-posta adresinden appeals@fluxer.app adresine itiraz edebilirsin.

    – Multiverse Güvenlik Ekibi
self_deletion_scheduled:
  subject: Multiverse hesabının silinmesi planlandı
  body: |-
    Merhaba {username},

    Multiverse hesabını silmek istediğini belirttin. Hesabın şu tarihte kalıcı olarak silinecek:

    {deletionDate, date, full} tarihinde {deletionDate, time, short} saatinde

    Bunu sen istemediysen, silme işlemini iptal etmek için hesabına giriş yap. Hesabını güvende tutmak için şifreni değiştirmeni de öneririz.

    – Multiverse Ekibi
unban_notification:
  subject: Multiverse hesabının askısı kaldırıldı
  body: |-
    Merhaba {username},

    Güzel haber: Multiverse hesabının askısı kaldırıldı.

    {reason, select,
      null {}
      other {Neden: {reason}}
    }

    Artık hesabına tekrar giriş yapıp Multiverse'i kullanmaya devam edebilirsin.

    – Multiverse Güvenlik Ekibi
