account_disabled_suspicious:
  subject: Ο λογαριασμός σου στο Multiverse απενεργοποιήθηκε προσωρινά
  body: |-
    Γεια σου {username},

    Απενεργοποιήσαμε προσωρινά τον λογαριασμό σου στο Multiverse, επειδή εντοπίσαμε ύποπτη δραστηριότητα.

    {reason, select,
      null {}
      other {Αιτία: {reason}}
    }

    Για να αποκτήσεις ξανά πρόσβαση στον λογαριασμό σου, θα χρειαστεί να επαναφέρεις τον κωδικό σου:

    {forgotUrl}

    Μόλις ορίσεις νέο κωδικό, θα μπορείς να συνδεθείς ξανά.

    Αν πιστεύεις ότι αυτό έγινε από λάθος, επικοινώνησε με την υποστήριξή μας.

    – Η ομάδα ασφάλειας του Multiverse
account_scheduled_deletion:
  subject: Ο λογαριασμός σου στο Multiverse θα διαγραφεί οριστικά
  body: |-
    Γεια σου {username},

    Ο λογαριασμός σου στο Multiverse έχει προγραμματιστεί για οριστική διαγραφή, επειδή παραβίασες τους όρους χρήσης ή τις οδηγίες κοινότητας.

    Προγραμματισμένη διαγραφή: {deletionDate, date, full} {deletionDate, time, short}

    {reason, select,
      null {}
      other {Αιτία: {reason}}
    }

    Πρόκειται για σοβαρό μέτρο. Τα δεδομένα του λογαριασμού σου θα διαγραφούν οριστικά στην παραπάνω ημερομηνία.

    Δες ξανά:
    - Όροι χρήσης: {termsUrl}
    - Οδηγίες κοινότητας: {guidelinesUrl}

    Υποβολή ένστασης:
    Αν πιστεύεις ότι η απόφαση είναι λανθασμένη ή αδικαιολόγητη, μπορείς να υποβάλεις ένσταση εντός 60 ημερών, στέλνοντας email στο doommedia@proton.me από αυτή τη διεύθυνση email.

    Στην ένστασή σου:
    - Εξήγησε καθαρά γιατί θεωρείς ότι η απόφαση είναι λανθασμένη ή αδικαιολόγητη
    - Πρόσθεσε, αν μπορείς, σχετικά στοιχεία ή επιπλέον πλαίσιο

    Ένα μέλος της ομάδας ασφάλειας του Multiverse θα εξετάσει την ένστασή σου και μπορεί να αναστείλει την προγραμματισμένη διαγραφή μέχρι να ληφθεί τελική απόφαση.

    – Η ομάδα ασφάλειας του Multiverse
account_temp_banned:
  subject: Ο λογαριασμός σου στο Multiverse τέθηκε προσωρινά σε αναστολή
  body: |-
    Γεια σου {username},

    Ο λογαριασμός σου στο Multiverse τέθηκε προσωρινά σε αναστολή, επειδή παραβίασες τους όρους χρήσης ή τις οδηγίες κοινότητας.

    Διάρκεια: {durationHours, plural,
      =1 {1 ώρα}
      other {# ώρες}
    }
    Σε αναστολή έως: {bannedUntil, date, full} {bannedUntil, time, short}

    {reason, select,
      null {}
      other {Αιτία: {reason}}
    }

    Μέχρι τότε, δεν θα μπορείς να έχεις πρόσβαση στον λογαριασμό σου.

    Δες ξανά:
    - Όροι χρήσης: {termsUrl}
    - Οδηγίες κοινότητας: {guidelinesUrl}

    Αν πιστεύεις ότι η απόφαση είναι λανθασμένη ή αδικαιολόγητη, μπορείς να υποβάλεις ένσταση στέλνοντας email στο doommedia@proton.me από αυτή τη διεύθυνση email. Εξήγησε καθαρά γιατί θεωρείς ότι η απόφαση είναι λάθος. Θα εξετάσουμε την ένστασή σου και θα σου απαντήσουμε με την απόφασή μας.

    – Η ομάδα ασφάλειας του Multiverse
donation_confirmation:
  subject: Ευχαριστούμε για τη δωρεά σας στο Multiverse
  body: |-
    Γεια σας,

    Ευχαριστούμε για τη δωρεά σας στο Multiverse! Η {interval, select,
      month {επαναλαμβανόμενη δωρεά σας}
      year {επαναλαμβανόμενη δωρεά σας}
      other {εφάπαξ δωρεά σας}
    } έχει {interval, select,
      month {ρυθμιστεί}
      year {ρυθμιστεί}
      other {επεξεργαστεί}
    } με επιτυχία.

    Λεπτομέρειες δωρεάς:
    Ποσό: {amount} {currency} {interval, select,
      month {ανά μήνα}
      year {ανά έτος}
      other {}
    }

    Η Stripe θα σας στείλει ξεχωριστό email με το τιμολόγιό σας σε μορφή PDF σύντομα. Αυτό περιλαμβάνει όλες τις λεπτομέρειες πληρωμής και μπορεί να χρησιμοποιηθεί για φορολογικούς σκοπούς.

    Μπορείτε να δείτε το ιστορικό δωρεών σας, να κατεβάσετε τιμολόγια, {interval, select,
      month {και να διαχειριστείτε ή να ακυρώσετε τη συνδρομή σας}
      year {και να διαχειριστείτε ή να ακυρώσετε τη συνδρομή σας}
      other {και να διαχειριστείτε μελλοντικές δωρεές}
    } ανά πάσα στιγμή χρησιμοποιώντας αυτόν τον σύνδεσμο:

    {manageUrl}

    Η υποστήριξή σας βοηθά το Multiverse να συνεχίσει να λειτουργεί. Ευχαριστούμε!

    – Ομάδα Multiverse
donation_magic_link:
  subject: Διαχείρισε τις δωρεές σου στο Multiverse
  body: |-
    Γεια σου,

    Κάνε κλικ στον παρακάτω σύνδεσμο για να αποκτήσεις πρόσβαση στην πύλη δωρητών:

    {manageUrl}

    Στην πύλη, μπορείς να διαχειριστείς συνδρομές, να κατεβάσεις τιμολόγια και να δεις το ιστορικό δωρεών σου.

    Ο σύνδεσμος λήγει στις {expiresAt, date, full} στις {expiresAt, time, short}.

    Αν δεν το ζήτησες εσύ, μπορείς να αγνοήσεις με ασφάλεια αυτό το email.

    – Η ομάδα του Multiverse
dsa_report_verification:
  subject: Επιβεβαίωσε το email σου για αναφορά DSA
  body: |-
    Γεια σου,

    Χρησιμοποίησε τον παρακάτω κωδικό για να υποβάλεις την αναφορά σου βάσει του Νόμου για τις Ψηφιακές Υπηρεσίες (DSA) στο Multiverse:

    {code}

    Ο κωδικός λήγει στις {expiresAt, date, full} {expiresAt, time, short}.

    Αν δεν το ζήτησες εσύ, μπορείς να αγνοήσεις αυτό το email.

    – Η ομάδα ασφάλειας του Multiverse
email_change_new:
  subject: Επιβεβαίωσε το νέο σου email στο Multiverse
  body: |-
    Γεια σου {username},

    Βάλε τον παρακάτω κωδικό στην εφαρμογή για να επιβεβαιώσεις το νέο σου email στο Multiverse:

    {code}

    Ο κωδικός λήγει στις {expiresAt, date, full} {expiresAt, time, short}.

    Αν δεν το ζήτησες εσύ, μπορείς να αγνοήσεις αυτό το email.

    – Η ομάδα του Multiverse
email_change_original:
  subject: Επιβεβαίωσε την αλλαγή email στο Multiverse
  body: |-
    Γεια σου {username},

    Λάβαμε αίτημα για αλλαγή της διεύθυνσης email στον λογαριασμό σου στο Multiverse.

    Για να επιβεβαιώσεις την αλλαγή, βάλε τον παρακάτω κωδικό στην εφαρμογή:

    {code}

    Ο κωδικός λήγει στις {expiresAt, date, full} {expiresAt, time, short}.

    Αν δεν το ζήτησες εσύ, ασφάλισε άμεσα τον λογαριασμό σου.

    – Η ομάδα του Multiverse
email_change_revert:
  subject: Η διεύθυνση email του λογαριασμού σου στο Multiverse άλλαξε
  body: |-
    Γεια σου {username},

    Η διεύθυνση email του λογαριασμού σου στο Multiverse άλλαξε σε {newEmail}.

    Αν έκανες εσύ αυτή την αλλαγή, δεν χρειάζεται να κάνεις τίποτα. Αν όχι, μπορείς να την αναιρέσεις και να ασφαλίσεις τον λογαριασμό σου από αυτόν τον σύνδεσμο:

    {revertUrl}

    Αυτό θα επαναφέρει το προηγούμενο email σου, θα σε αποσυνδέσει από όλες τις συσκευές, θα αφαιρέσει τα συνδεδεμένα τηλέφωνα, θα απενεργοποιήσει τον πολυπαραγοντικό έλεγχο ταυτότητας (MFA) και θα απαιτήσει να ορίσεις νέο κωδικό.

    – Η ομάδα ασφάλειας του Multiverse
email_verification:
  subject: Επιβεβαίωσε τη διεύθυνση email σου στο Multiverse
  body: |-
    Γεια σου {username},

    Επιβεβαίωσε τη διεύθυνση email του λογαριασμού σου στο Multiverse πατώντας τον παρακάτω σύνδεσμο:

    {verifyUrl}

    Αν δεν έφτιαξες εσύ λογαριασμό στο Multiverse, μπορείς να αγνοήσεις με ασφάλεια αυτό το email.

    Ο σύνδεσμος είναι έγκυρος για 24 ώρες.

    – Η ομάδα του Multiverse
gift_chargeback_notification:
  subject: Τα προνόμια από το εξαργυρωμένο δώρο σου αφαιρέθηκαν
  body: |-
    Γεια σου {username},

    Ένας κωδικός δώρου που εξαργύρωσες είχε αρχικά πληρωθεί από κάποιον άλλον. Η πληρωμή έχει πλέον αντιστραφεί (chargeback).

    Γι' αυτό αφαιρέσαμε τα προνόμια που προστέθηκαν στον λογαριασμό σου όταν εξαργύρωσες το δώρο.

    Αν πιστεύεις ότι πρόκειται για λάθος, επικοινώνησε με την υποστήριξή μας και συμπεριέλαβε όσες λεπτομέρειες έχεις για τον κωδικό δώρου και το πότε τον εξαργύρωσες.

    – Η ομάδα του Multiverse
harvest_completed:
  subject: Η εξαγωγή δεδομένων σου στο Multiverse είναι έτοιμη για λήψη
  body: |-
    Γεια σου {username},

    Η εξαγωγή των δεδομένων σου είναι έτοιμη.

    Σύνδεσμος λήψης:
    {downloadUrl}

    Μηνύματα που περιλαμβάνονται: {totalMessages, number}
    Μέγεθος αρχείου: {fileSizeMB, number} MB

    Ο σύνδεσμος λήγει στις {expiresAt, date, full} {expiresAt, time, short}.

    Αν δεν το ζήτησες εσύ, άλλαξε άμεσα τον κωδικό σου και επικοινώνησε με την υποστήριξή μας.

    – Η ομάδα του Multiverse
inactivity_warning:
  subject: Ο λογαριασμός σου στο Multiverse θα διαγραφεί λόγω αδράνειας
  body: |-
    Γεια σου {username},

    Δεν έχουμε δει καμία δραστηριότητα στον λογαριασμό σου στο Multiverse από τις {lastActiveDate, date, full}.

    Αν δεν συνδεθείς μέχρι τις {deletionDate, date, full} {deletionDate, time, short}, ο λογαριασμός σου θα διαγραφεί οριστικά λόγω αδράνειας.

    Συνδέσου εδώ:
    {loginUrl}

    Αν έχεις χρησιμοποιήσει το Multiverse πρόσφατα, επικοινώνησε άμεσα με την υποστήριξή μας.

    – Η ομάδα του Multiverse
ip_authorization:
  subject: Επιβεβαίωσε σύνδεση από νέα διεύθυνση IP
  body: |-
    Γεια σου {username},

    Εντοπίσαμε προσπάθεια σύνδεσης στον λογαριασμό σου στο Multiverse από νέα διεύθυνση IP:

    Διεύθυνση IP: {ipAddress}
    Τοποθεσία: {location}

    Αν ήσουν εσύ, επιβεβαίωσε αυτή τη διεύθυνση IP από τον παρακάτω σύνδεσμο:

    {authUrl}

    Αν δεν προσπάθησες να συνδεθείς εσύ, άλλαξε άμεσα τον κωδικό σου.

    Ο σύνδεσμος επιβεβαίωσης λήγει σε 30 λεπτά.

    – Η ομάδα του Multiverse
password_change_verification:
  subject: Επιβεβαίωσε την αλλαγή κωδικού σου στο Multiverse
  body: |-
    Γεια σου {username},

    Λάβαμε αίτημα για αλλαγή του κωδικού στον λογαριασμό σου στο Multiverse.

    Για να επιβεβαιώσεις την αλλαγή, βάλε τον παρακάτω κωδικό στην εφαρμογή:

    {code}

    Ο κωδικός λήγει στις {expiresAt}.

    Αν δεν το ζήτησες εσύ, κάποιος μπορεί να έχει πρόσβαση στον λογαριασμό σου. Άλλαξε άμεσα τον κωδικό σου και ενεργοποίησε τον πολυπαραγοντικό έλεγχο ταυτότητας.

    – Η ομάδα του Multiverse
password_reset:
  subject: Επαναφορά του κωδικού σου στο Multiverse
  body: |-
    Γεια σου {username},

    Ζήτησες επαναφορά του κωδικού σου στο Multiverse. Χρησιμοποίησε τον παρακάτω σύνδεσμο για να ορίσεις νέο κωδικό:

    {resetUrl}

    Αν δεν το ζήτησες εσύ, μπορείς να αγνοήσεις με ασφάλεια αυτό το email.

    Ο σύνδεσμος λήγει σε 1 ώρα.

    – Η ομάδα του Multiverse
registration_approved:
  subject: Η εγγραφή σου στο Multiverse εγκρίθηκε
  body: |-
    Γεια σου {username},

    Καλά νέα: η εγγραφή σου στο Multiverse εγκρίθηκε.

    Μπορείς τώρα να συνδεθείς στην εφαρμογή Multiverse εδώ:
    {channelsUrl}

    Καλώς ήρθες στην κοινότητα του Multiverse.

    – Η ομάδα του Multiverse
report_resolved:
  subject: Η αναφορά σου στο Multiverse εξετάστηκε
  body: |-
    Γεια σου {username},

    Η αναφορά σου (ID: {reportId}) εξετάστηκε από την ομάδα ασφάλειάς μας.

    Απάντηση από την ομάδα ασφάλειας:
    {publicComment}

    Ευχαριστούμε που βοηθάς να παραμένει το Multiverse ασφαλές για όλους. Παίρνουμε όλες τις αναφορές στα σοβαρά και εκτιμάμε τη συμβολή σου στην κοινότητα.

    Αν έχεις απορίες ή ανησυχίες για το αποτέλεσμα, επικοινώνησε στο doommedia@proton.me.

    – Η ομάδα ασφάλειας του Multiverse
scheduled_deletion_notification:
  subject: Ο λογαριασμός σου στο Multiverse θα διαγραφεί οριστικά
  body: |-
    Γεια σου {username},

    Ο λογαριασμός σου στο Multiverse έχει προγραμματιστεί για οριστική διαγραφή.

    Προγραμματισμένη διαγραφή: {deletionDate, date, full} {deletionDate, time, short}

    {reason, select,
      null {}
      other {Αιτία: {reason}}
    }

    Πρόκειται για σοβαρό μέτρο. Τα δεδομένα του λογαριασμού σου θα διαγραφούν οριστικά στην παραπάνω ημερομηνία.

    Αν πιστεύεις ότι η απόφαση είναι λανθασμένη, μπορείς να υποβάλεις ένσταση στέλνοντας email στο doommedia@proton.me από αυτή τη διεύθυνση email.

    – Η ομάδα ασφάλειας του Multiverse
self_deletion_scheduled:
  subject: Η διαγραφή του λογαριασμού σου στο Multiverse έχει προγραμματιστεί
  body: |-
    Γεια σου {username},

    Ζήτησες να διαγραφεί ο λογαριασμός σου στο Multiverse. Η οριστική διαγραφή έχει προγραμματιστεί για:

    {deletionDate, date, full} {deletionDate, time, short}

    Αν δεν το ζήτησες εσύ, συνδέσου στον λογαριασμό σου για να ακυρώσεις τη διαγραφή. Προτείνουμε επίσης να αλλάξεις τον κωδικό σου, ώστε να ασφαλίσεις τον λογαριασμό σου.

    – Η ομάδα του Multiverse
unban_notification:
  subject: Η αναστολή του λογαριασμού σου στο Multiverse άρθηκε
  body: |-
    Γεια σου {username},

    Καλά νέα: η αναστολή του λογαριασμού σου στο Multiverse άρθηκε.

    {reason, select,
      null {}
      other {Αιτία: {reason}}
    }

    Μπορείς τώρα να συνδεθείς ξανά και να συνεχίσεις να χρησιμοποιείς το Multiverse κανονικά.

    – Η ομάδα ασφάλειας του Multiverse
