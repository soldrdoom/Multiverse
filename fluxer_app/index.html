<script nonce="{{CSP_NONCE_PLACEHOLDER}}">(function(){
  /* CACHE-KILLER v2 — one-time purge of stale caches on ALL domains (including production) */
  try {
    var KEY = 'mv_ck_v2';
    if (!localStorage.getItem(KEY)) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function(names) {
          names.forEach(function(n) { caches.delete(n); });
        });
      }
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem(KEY, '1'); /* write AFTER clear so it survives */
    }
  } catch(e) {}
})();</script>
<script nonce="{{CSP_NONCE_PLACEHOLDER}}">(function(){try{var loc=window.location;if(loc.pathname==='/'){var target='/channels/@me';if(loc.search)target+=loc.search;if(loc.hash)target+=loc.hash;loc.replace(target);}}catch(e){}})();</script>
